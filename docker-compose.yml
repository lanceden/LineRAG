version: '3.8'

services:
  # FastAPI 後端
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # OpenAI / vLLM 設定 (可通過 .env 覆蓋)
      - OPENAI_API_BASE=${OPENAI_API_BASE:-http://vllm:8000/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-not-needed}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-TheBloke/Qwen2-7B-Chat-AWQ}
      
      # 向量資料庫設定 (可通過 .env 覆蓋)
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      - USE_LOCAL_QDRANT=${USE_LOCAL_QDRANT:-false}
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - QDRANT_PATH=${QDRANT_PATH:-/app/data/qdrant}
      - COLLECTION_NAME=${COLLECTION_NAME:-documents}
      
      # LINE Bot 設定
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN:-}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET:-}
      - LINE_REPLY_ENDPOINT=${LINE_REPLY_ENDPOINT:-https://api.line.me/v2/bot/message/reply}
      
      # Redis 設定
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      
      # 其他設定
      - UPLOAD_IMAGE_DIR=${UPLOAD_IMAGE_DIR:-/app/uploads/images}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CHUNK_SIZE=${CHUNK_SIZE:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-200}
    volumes:
      - api_data:/app/data
      - api_uploads:/app/uploads
    depends_on:
      - redis
      - qdrant
      - vllm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - linerag-network

  # Next.js 前端
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_PYTHON_API_URL=http://localhost:8000
      - PYTHON_API_URL=http://api:8000
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-fallback-secret-key}
      - LINE_CLIENT_ID=${LINE_CLIENT_ID:-}
      - LINE_CLIENT_SECRET=${LINE_CLIENT_SECRET:-}
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - linerag-network

  # vLLM 推理引擎 (可動態切換模型)
  vllm:
    image: vllm/vllm-openai:latest
    ports:
      - "8001:8000"
    command: >
      --model ${LLM_MODEL_REPO:-Qwen/Qwen2.5-VL-7B-Instruct}
      --served-model-name ${LLM_MODEL_NAME:-qwen-2.5-vl}
      --host 0.0.0.0
      --port 8000
      --max-model-len 4096
      --gpu-memory-utilization 0.8
      --trust-remote-code
      --disable-log-stats
    volumes:
      - model_cache:/root/.cache/huggingface
      - ./models:/models:ro
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_HOME=/root/.cache/huggingface
      - LLM_MODEL_REPO=${LLM_MODEL_REPO:-Qwen/Qwen2.5-VL-7B-Instruct}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-qwen-2.5-vl}
      - MODEL_CONFIG_PATH=/models/config.json
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s  # vLLM需要較長時間載入模型
    restart: unless-stopped
    networks:
      - linerag-network

  # Redis 任務隊列
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - linerag-network

  # Qdrant 向量資料庫
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ${QDRANT_STORAGE_PATH:-qdrant_storage}:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - linerag-network

volumes:
  api_data:
    driver: local
  api_uploads:
    driver: local
  model_cache:
    driver: local
  qdrant_storage:
    driver: local
  redis_data:
    driver: local

networks:
  linerag-network:
    driver: bridge