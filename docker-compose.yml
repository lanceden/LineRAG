version: '3.8'

services:
  # FastAPI 後端 - 多租戶架構
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # 必須配置 - PostgreSQL 資料庫連接
      - DATABASE_URL=${DATABASE_URL}
      
      # RAG-Anything 配置
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - COLLECTION_NAME=${COLLECTION_NAME:-documents}
      
      # LLM 服務配置 - 使用 OpenAI GPT
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      
      # LINE Bot 配置 (可選)
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN:-}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET:-}
      
      # 管理員設定 (可選)
      - ADMIN_LINE_IDS=${ADMIN_LINE_IDS:-}
      
      # 其他設定
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - UPLOAD_IMAGE_DIR=${UPLOAD_IMAGE_DIR:-/app/uploads/images}
    volumes:
      - api_uploads:/app/uploads
      - rag_storage:/app/rag_storage
    depends_on:
      - qdrant
      # vLLM 是可選的，如果使用外部 LLM 服務可以移除
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - linerag-network

  # Next.js 前端
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # API 連接
      - NEXT_PUBLIC_PYTHON_API_URL=${NEXT_PUBLIC_PYTHON_API_URL:-http://localhost:8000/api}
      - PYTHON_API_URL=http://api:8000/api
      
      # NextAuth 配置
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      
      # LINE OAuth 配置 (可選)
      - LINE_CLIENT_ID=${LINE_CLIENT_ID:-}
      - LINE_CLIENT_SECRET=${LINE_CLIENT_SECRET:-}
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - linerag-network

  # Qdrant 向量資料庫
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - linerag-network

volumes:
  api_uploads:
    driver: local
  rag_storage:
    driver: local

networks:
  linerag-network:
    driver: bridge