version: '3.8'

services:
  # FastAPI 後端 - 多租戶架構
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # 必須配置 - PostgreSQL 資料庫連接
      - DATABASE_URL=${DATABASE_URL}
      
      # RAG-Anything 配置
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - COLLECTION_NAME=${COLLECTION_NAME:-documents}
      
      # LLM 服務配置 - 使用 OpenAI GPT
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      
      # LINE Bot 配置 (可選)
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN:-}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET:-}
      
      # 管理員設定 (可選)
      - ADMIN_LINE_IDS=${ADMIN_LINE_IDS:-}
      
      # 其他設定
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - UPLOAD_IMAGE_DIR=${UPLOAD_IMAGE_DIR:-/app/uploads/images}
    volumes:
      - api_uploads:/app/uploads
      - rag_storage:/app/rag_storage
    depends_on:
      - qdrant
      - neo4j
      # vLLM 是可選的，如果使用外部 LLM 服務可以移除
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - linerag-network

  # Next.js 前端
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # API 連接
      - NEXT_PUBLIC_PYTHON_API_URL=${NEXT_PUBLIC_PYTHON_API_URL:-http://localhost:8000/api}
      - PYTHON_API_URL=http://api:8000/api
      
      # NextAuth 配置
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      
      # LINE OAuth 配置 (可選)
      - LINE_CLIENT_ID=${LINE_CLIENT_ID:-}
      - LINE_CLIENT_SECRET=${LINE_CLIENT_SECRET:-}
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - linerag-network

  # Qdrant 向量資料庫
  qdrant:
    image: qdrant/qdrant:v1.7.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - linerag-network
    
  neo4j:
    image: neo4j:5.20
    container_name: linerag-neo4j
    ports:
      - "7374:7474"   # HTTP Browser (避開 Windows 保留端口 7410-7509)
      - "7687:7687"   # Bolt
      - "2004:2004"   # Metrics
    environment:
      - NEO4J_AUTH=neo4j/linerag123
      # 記憶體配置 (Neo4j 5.20 基本配置)
      - NEO4J_server_memory_heap_initial__size=2G
      - NEO4J_server_memory_heap_max__size=4G
      - NEO4J_server_memory_pagecache_size=2G
      # 安全設定和插件
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      # Prometheus 監控配置
      - NEO4J_server_metrics_enabled=true
      - NEO4J_server_metrics_prometheus_enabled=true
      - NEO4J_server_metrics_prometheus_endpoint=0.0.0.0:2004
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs
      - ./neo4j_import:/var/lib/neo4j/import
      - ./backups/neo4j:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "linerag123", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - linerag-network

  # Prometheus 監控數據收集
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - linerag-network

  # Grafana 監控 Dashboard
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3008:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=linerag123
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - linerag-network
    
volumes:
  api_uploads:
    driver: local
  rag_storage:
    driver: local
  # 備份存儲
  backups:
    driver: local
  # 監控數據存儲
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  linerag-network:
    driver: bridge